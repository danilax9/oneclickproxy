<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>OneClick Proxy</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app">

  <section class="screen" data-screen="error">
    <div class="error-screen">
      <p class="error-screen__text" id="errorScreenText">Failed to load extension</p>
      <button type="button" class="btn btn--accent btn--block" id="retryInitBtn">Retry</button>
    </div>
  </section>

  <!-- ЭКРАН: ГЛАВНЫЙ -->
  <section class="screen active" data-screen="home">
    <div class="banner banner--warn hidden" id="conflictBanner">
      Proxy overridden by another extension
      <button type="button" class="banner__action" id="dismissConflictBtn">OK</button>
    </div>

    <div class="topbar">
      <button class="icon-btn icon-btn--ghost" id="openSettingsBtn" title="Settings">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="topbar__status">
        <div class="home__title" id="homeOff">Off</div>
        <div class="home__title home__title--on hidden" id="homeOn">
          <span class="home__flag-wrap flag-badge">
            <img class="home__flag" id="homeFlag" alt="" />
          </span>
          <span class="home__country" id="homeCountry"></span>
        </div>
        <div class="home__title home__title--fallback hidden" id="homeFallback">Connected</div>
      </div>

      <button class="icon-btn icon-btn--ghost" id="openAddBtn" title="Add proxy">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="home">
      <button class="power-btn" id="powerBtn">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path d="M12 3v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M6.5 6.5a8 8 0 1 0 11 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- ЭКРАН: СПИСОК / ВЫБОР ОСНОВНОГО -->
  <section class="screen" data-screen="settings">
    <div class="subheader">
      <button class="icon-btn icon-btn--ghost" id="backFromSettingsBtn" title="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h2>Proxies</h2>
      <div class="subheader__actions">
        <button class="icon-btn icon-btn--ghost" id="refreshPingBtn" type="button" title="Refresh ping">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.05-5.32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M20 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--ghost" id="openRulesBtn" type="button" title="Routing rules">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6h16M4 12h10M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--ghost" id="exportBtn" type="button" title="Export">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 4v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M8.5 10.5 12 14l3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 18h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--ghost" id="importBtn" type="button" title="Import">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 20V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M8.5 13.5 12 10l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 6h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--ghost" id="openAddFromSettingsBtn" title="Add proxy">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input type="file" id="importFile" accept=".json,application/json" hidden />
      </div>
    </div>

    <div class="settings-body">
      <div class="list-group">
        <div class="list" id="list"></div>
      </div>
    </div>
  </section>

  <!-- ЭКРАН: ПРАВИЛА -->
  <section class="screen" data-screen="rules">
    <div class="subheader">
      <button class="icon-btn icon-btn--ghost" id="backFromRulesBtn" title="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h2>Rules</h2>
      <span class="subheader__spacer"></span>
    </div>

    <div class="rules-form">
      <div class="mode-switch" role="radiogroup" aria-label="Rules mode">
        <button class="mode-switch__btn active" type="button" data-mode="bypass" id="modeBypassBtn">
          Bypass
        </button>
        <button class="mode-switch__btn" type="button" data-mode="whitelist" id="modeWhitelistBtn">
          Proxy only
        </button>
      </div>

      <label class="field-label field-label--plain" for="rulesInput">Domains</label>
      <textarea
        id="rulesInput"
        class="textarea"
        rows="8"
        placeholder="*.ru&#10;chatgpt.com"
        spellcheck="false"
      ></textarea>

      <div id="rulesError" class="error hidden"></div>

      <button id="saveRulesBtn" type="button" class="btn btn--accent btn--block">Save</button>
    </div>
  </section>

  <!-- ЭКРАН: ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ -->
  <section class="screen" data-screen="add">
    <div class="subheader">
      <button class="icon-btn icon-btn--ghost" id="backFromAddBtn" title="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h2 id="addScreenTitle">New proxy</h2>
      <div class="subheader__actions" id="clipActions">
        <button class="icon-btn icon-btn--ghost" id="copyProxyBtn" type="button" title="Copy">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn icon-btn--ghost" id="pasteProxyBtn" type="button" title="Paste">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <rect x="9" y="3" width="6" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
        <span class="subheader__success" id="clipSuccessIcon" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="add-form">
      <input
        id="proxyInput"
        class="input"
        type="text"
        placeholder="https://user:pass@proxy.com:3128"
        autocomplete="off"
        spellcheck="false"
      />
      <p class="form-hint" id="inputHint">Tests the proxy before saving</p>

      <button id="addBtn" class="btn btn--accent btn--block">
        <span class="btn__label">Test & add</span>
        <span class="btn__success hidden" id="addBtnSuccess" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="spinner hidden" id="spinner"></span>
      </button>
    </div>
  </section>

</div>

<div class="modal hidden" id="modal">
  <div class="modal__box">
    <p class="modal__text" id="modalText"></p>
    <div class="modal__actions">
      <button type="button" class="btn btn--ghost-block" id="modalCancel">Cancel</button>
      <button type="button" class="btn btn--danger-block" id="modalConfirm">Delete</button>
    </div>
  </div>
</div>

<template id="proxyItemTemplate">
  <div class="item" data-id="">
    <button class="item__select" type="button">
      <span class="item__label">
        <span class="item__flag-wrap flag-badge hidden">
          <img class="item__flag" alt="" />
        </span>
        <span class="item__body">
          <span class="item__name"></span>
          <span class="item__meta hidden">
            <span class="item__ping hidden"></span>
            <span class="badge badge--https hidden">HTTPS</span>
          </span>
        </span>
      </span>
    </button>
    <div class="item__actions">
      <button class="item__edit" title="Edit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="item__delete" title="Delete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</template>

<script src="popup.js"></script>
</body>
</html>
